# Railway deployment — uses the Dockerfile (Node 22 + ffmpeg + python3)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/ping"
healthcheckTimeout = 120
restartPolicyType = "ALWAYS"
# Only ONE replica: two processes would open the same WhatsApp session (440 conflict)
numReplicas = 1
