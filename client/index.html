<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CYBERSECPRO — Professional WhatsApp bot management platform for number linking, sessions, and control center operations" />
    <meta name="theme-color" content="#09090b" />
    <title>CYBERSECPRO — Bot Management Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1629;color:#e2e8f0;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px">
        <div>
          <div style="font-size:22px;font-weight:800;letter-spacing:.08em;color:#22d3ee">CYBERSECPRO</div>
          <h1 style="margin:20px 0 8px;color:#f8fafc;font-size:clamp(28px,5vw,48px);line-height:1.1">Professional bot management, secured.</h1>
          <div style="max-width:560px;margin:0 auto;color:#cbd5e1;font-size:16px;line-height:1.6">Link, monitor, and control your WhatsApp bot infrastructure from one secure control center.</div>
          <div style="margin:20px auto 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;color:#94a3b8;font-size:13px">
            <span style="border:1px solid rgba(34,211,238,.25);border-radius:999px;padding:6px 10px">Secure pairing</span>
            <span style="border:1px solid rgba(139,92,246,.25);border-radius:999px;padding:6px 10px">Real-time stats</span>
            <span style="border:1px solid rgba(52,211,153,.25);border-radius:999px;padding:6px 10px">Protected sessions</span>
          </div>
          <div style="margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <a href="/signup" style="border:1px solid #22d3ee;border-radius:10px;background:#22d3ee;color:#07111f;padding:11px 20px;text-decoration:none;font-weight:800">Get started free</a>
            <a href="/login" style="border:1px solid #8b5cf6;border-radius:10px;color:#c4b5fd;padding:10px 18px;text-decoration:none;font-weight:700">Login</a>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var fallback = document.getElementById('boot-fallback');
        if (!fallback) return;
        var showFailure = function () {
          fallback.innerHTML =
            '<div>' +
            '<div style="font-size:22px;font-weight:800;letter-spacing:.08em;color:#22d3ee">CYBERSECPRO</div>' +
            '<div style="margin-top:20px;color:#cbd5e1;font-size:15px">The control center could not finish loading.</div>' +
            '<div style="margin-top:8px;color:#94a3b8;font-size:13px">You can still use the links below or reload the page.</div>' +
            '<div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
            '<a href="/login" style="border:1px solid #22d3ee;border-radius:10px;color:#22d3ee;padding:10px 18px;text-decoration:none;font-weight:700">Login</a>' +
            '<a href="/signup" style="border:1px solid #8b5cf6;border-radius:10px;color:#c4b5fd;padding:10px 18px;text-decoration:none;font-weight:700">Sign up</a>' +
            '<button onclick="location.reload()" style="border:1px solid #64748b;border-radius:10px;background:transparent;color:#cbd5e1;padding:10px 18px;font-weight:700;cursor:pointer">Reload</button>' +
            '</div></div>';
        };
        window.addEventListener('error', showFailure);
        window.addEventListener('unhandledrejection', showFailure);
        window.setTimeout(function () {
          if (document.getElementById('boot-fallback')) showFailure();
        }, 10000);
      }());
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
