<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CYBERSECPRO — Professional WhatsApp bot management platform for number linking, sessions, and control center operations" />
    <meta name="theme-color" content="#09090b" />
    <title>CYBERSECPRO — Bot Management Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div id="boot-loader" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1629;color:#94a3b8;font-family:Inter,system-ui,sans-serif">
        <div style="text-align:center">
          <div style="width:56px;height:56px;margin:0 auto 18px;border:2px solid rgba(34,211,238,.2);border-top-color:#22d3ee;border-radius:50%;animation:cybersecpro-spin 1s linear infinite"></div>
          <div style="font-size:13px;letter-spacing:.08em;text-transform:uppercase">Loading CYBERSECPRO</div>
        </div>
      </div>
    </div>
    <style>@keyframes cybersecpro-spin{to{transform:rotate(360deg)}}</style>
    <script>
      (function () {
        var loader = document.getElementById('boot-loader');
        if (!loader) return;
        var fail = function (message) {
          loader.innerHTML =
            '<div style="text-align:center;padding:24px">' +
            '<div style="font-size:18px;font-weight:800;letter-spacing:.08em;color:#22d3ee">CYBERSECPRO</div>' +
            '<div style="margin-top:16px;color:#cbd5e1">The control center could not start.</div>' +
            '<div style="margin-top:8px;color:#64748b;font-size:12px">' + (message || 'Please reload the page.') + '</div>' +
            '<button onclick="location.reload()" style="margin-top:20px;border:1px solid #22d3ee;border-radius:9px;background:transparent;color:#22d3ee;padding:9px 16px;font-weight:700;cursor:pointer">Reload</button>' +
            '</div>';
        };
        window.addEventListener('error', function (event) {
          console.error('[CYBERSECPRO] startup error', event.error || event.message);
          fail('A browser error interrupted startup.');
        });
        window.addEventListener('unhandledrejection', function (event) {
          console.error('[CYBERSECPRO] startup rejection', event.reason);
          fail('A browser request interrupted startup.');
        });
        window.setTimeout(function () {
          if (document.getElementById('boot-loader')) fail('Startup is taking too long on this connection.');
        }, 15000);
      }());
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
